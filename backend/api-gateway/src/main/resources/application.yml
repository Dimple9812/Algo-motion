server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application.name: api-gateway
  data.redis:
    # REDIS_URL (redis://user:password@host:port, as managed Redis providers supply it) wins over host/port.
    url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
gateway:
  services:
    user-progress-service: ${USER_SERVICE_URL:http://localhost:8081}
    algorithm-visualization-service: ${VIZ_SERVICE_URL:http://localhost:8082}
    problem-catalog-service: ${CATALOG_SERVICE_URL:http://localhost:8083}
    ai-solution-service: ${AI_SERVICE_URL:http://localhost:8085}
    code-execution-service: ${EXECUTION_SERVICE_URL:http://localhost:8086}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  ai-provider: ${AI_PROVIDER:fallback}
  execution-sandbox: ${EXECUTION_SANDBOX:docker}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus,gateway
  endpoint.health.probes.enabled: true
logging:
  pattern.level: "%5p [${spring.application.name},%X{correlationId:-}]"
