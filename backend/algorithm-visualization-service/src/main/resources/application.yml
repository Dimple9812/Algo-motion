server:
  port: ${PORT:8082}
  shutdown: graceful
spring:
  application.name: algorithm-visualization-service
algomotion:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    token: ${INTERNAL_TOKEN}
  messaging.enabled: false
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
logging:
  pattern.level: "%5p [${spring.application.name},%X{correlationId:-}]"
springdoc:
  api-docs.path: /v3/api-docs
