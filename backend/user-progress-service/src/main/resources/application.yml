server:
  port: ${PORT:8081}
  shutdown: graceful
spring:
  application.name: user-progress-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algomotion}
    username: ${DB_USER:algomotion}
    password: ${DB_PASSWORD:algomotion}
    hikari:
      maximum-pool-size: 5
      schema: users
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: users
  flyway:
    schemas: users
    default-schema: users
algomotion:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    token: ${INTERNAL_TOKEN}
  messaging.enabled: false
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
logging:
  pattern.level: "%5p [${spring.application.name},%X{correlationId:-}]"
springdoc:
  api-docs.path: /v3/api-docs
user-service:
  catalog-url: ${CATALOG_URL:http://localhost:8083}
  cookie-secure: ${COOKIE_SECURE:false}
