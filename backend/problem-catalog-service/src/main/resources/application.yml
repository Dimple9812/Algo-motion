server:
  port: ${PORT:8083}
  shutdown: graceful
spring:
  application.name: problem-catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algomotion}
    username: ${DB_USER:algomotion}
    password: ${DB_PASSWORD:algomotion}
    hikari:
      maximum-pool-size: 5
      schema: catalog
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: catalog
  flyway:
    schemas: catalog
    default-schema: catalog
algomotion:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    token: ${INTERNAL_TOKEN}
  messaging.enabled: false
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
logging:
  pattern.level: "%5p [${spring.application.name},%X{correlationId:-}]"
springdoc:
  api-docs.path: /v3/api-docs
