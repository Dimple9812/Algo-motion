name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright (frontend-only journeys; backend journeys skip themselves)
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }

  content:
    name: Problem catalog — compile and run every reference solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: python3 content/src/build.py --verify
      - name: problems.json is up to date
        run: git diff --exit-code content/problems.json

  backend:
    name: Backend — compile, unit + integration tests (Testcontainers, embedded Kafka)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: mvn verify
        working-directory: backend
        env: { TZ: UTC }
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: surefire-reports, path: backend/**/target/surefire-reports, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Build all images
        run: docker compose build
